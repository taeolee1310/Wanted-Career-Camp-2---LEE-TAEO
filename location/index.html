<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오시는 길</title>
  <meta name="description" content="커리어 캠프 오프라인 장소 안내: 주소, 지도">
  <link rel="stylesheet" href="css/location.css">
  <script src="js/location.js" defer></script>
</head>
<body>
  <header class="gnav">
    <nav class="gnav__inner" aria-label="주요 메뉴">
      <button class="gnav__toggle" type="button" aria-expanded="false" aria-controls="gnav-links">메뉴</button>
      <ul class="gnav__links" id="gnav-links">
        <li><a href="../index.html">메인화면</a></li>
        <li><a href="../about/index.html">캠프소개</a></li>
        <li><a href="../dayoff/index.html">일정표</a></li>
        <li><a href="index.html" aria-current="page">오시는 길</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="tile tile--light tile--center">
      <h1>오시는 길</h1>
      <p class="lead">오프라인 일정은 아래 장소에서 진행됩니다.</p>
    </section>

    <section class="tile tile--parchment" id="map">
      <div class="container map-grid">
        <!-- shortcut: 주소 검색형 embed, 공식 "지도 퍼가기" 코드를 받으면 src를 교체 -->
        <iframe class="map" title="원티드그라운드 위치 지도"
          src="https://maps.google.com/maps?q=%EC%84%9C%EC%9A%B8%20%EC%86%A1%ED%8C%8C%EA%B5%AC%20%EB%B0%B1%EC%A0%9C%EA%B3%A0%EB%B6%84%EB%A1%9C37%EA%B8%B8%2022&output=embed"
          allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <div class="card">
          <h2>원티드그라운드</h2>
          <dl>
            <dt>주소</dt>
            <dd id="address">서울시 송파구 백제고분로 37길 22, 원티드그라운드</dd>
          </dl>
          <div class="actions">
            <button class="btn" type="button" id="copy-address">주소 복사</button>
            <a class="btn btn--ghost" href="https://maps.google.com/maps?q=%EC%84%9C%EC%9A%B8%20%EC%86%A1%ED%8C%8C%EA%B5%AC%20%EB%B0%B1%EC%A0%9C%EA%B3%A0%EB%B6%84%EB%A1%9C37%EA%B8%B8%2022" target="_blank" rel="noopener">Google 지도에서 보기</a>
          </div>
          <p class="note" id="copy-msg" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section class="tile tile--light">
      <div class="container">
        <h2 class="section-title">오프라인 일정</h2>
        <p>오프라인 일정은 <a href="../dayoff/index.html">일정표</a>에서 확인해 주세요.</p>
      </div>
    </section>
  </main>
</body>
</html>
