<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오시는 길</title>
  <meta name="description" content="커리어 캠프 오프라인 장소 안내: 주소, 대중교통, 주차">
  <link rel="stylesheet" href="css/location.css">
  <script src="js/location.js" defer></script>
</head>
<body>
  <header class="gnav">
    <nav class="gnav__inner" aria-label="주요 메뉴">
      <button class="gnav__toggle" type="button" aria-expanded="false" aria-controls="gnav-links">메뉴</button>
      <ul class="gnav__links" id="gnav-links">
        <li><a href="../index.html">메인화면</a></li>
        <li><a href="../about/index.html">캠프소개</a></li>
        <li><a href="../dayoff/index.html">일정표</a></li>
        <li><a href="index.html" aria-current="page">오시는 길</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="tile tile--light tile--center">
      <h1>오시는 길</h1>
      <p class="lead">오프라인 일정은 아래 장소에서 진행됩니다.</p>
    </section>

    <section class="tile tile--parchment" id="map">
      <div class="container map-grid">
        <!-- Google Maps 공유 → 지도 퍼가기 -->
        <iframe class="map" title="원티드랩 위치 지도"
          src="https://www.google.com/maps/embed?pb=!1m5!3m3!1m2!1s0x357ca50ac4f34397%3A0xc09ec1e9982c48e!2zKOyjvCnsm5Dti7Drk5zrnqk!5e0!3m2!1sko!2skr!4v1792480563630!5m2!1sko!2skr"
          allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <div class="card">
          <h2>원티드랩</h2>
          <dl>
            <dt>주소</dt>
            <dd id="address">서울 송파구 올림픽로 300 롯데월드타워 35층</dd>
          </dl>
          <div class="actions">
            <button class="btn" type="button" id="copy-address">주소 복사</button>
            <a class="btn btn--ghost" href="https://maps.google.com/maps?q=%EC%9B%90%ED%8B%B0%EB%93%9C%EB%9E%A9" target="_blank" rel="noopener">Google 지도에서 보기</a>
          </div>
          <p class="note" id="copy-msg" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section class="tile tile--light">
      <div class="container">
        <h2 class="section-title">대중교통</h2>
        <div class="grid">
          <article class="card card--line">
            <h3>지하철</h3>
            <p>2호선·8호선 잠실역 하차, 롯데월드타워 방면 도보 이동</p>
          </article>
          <article class="card card--line">
            <h3>버스</h3>
            <p>잠실역 정류장 하차 후 롯데월드타워 방면 도보 이동</p>
          </article>
        </div>
      </div>
    </section>

    <section class="tile tile--dark">
      <div class="container">
        <h2 class="section-title">주차</h2>
        <p>롯데월드타워 주차장을 이용할 수 있으며, 주차 요금은 별도입니다. 대중교통 이용을 권장합니다.</p>
      </div>
    </section>

    <section class="tile tile--parchment">
      <div class="container">
        <h2 class="section-title">오프라인 일정</h2>
        <p>오프라인 일정은 <a href="../dayoff/index.html">일정표</a>에서 확인해 주세요.</p>
      </div>
    </section>
  </main>
</body>
</html>
