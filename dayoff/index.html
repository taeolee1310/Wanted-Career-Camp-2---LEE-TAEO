<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일정표</title>
  <meta name="description" content="커리어 캠프 교육 기간의 단계별 로드맵과 오프라인 일정 안내">
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/chrome.css">
  <link rel="stylesheet" href="css/dayoff.css">
  <script src="../content/data.js" defer></script>
  <script src="../js/chrome.js" defer></script>
  <script src="js/dayoff.js" defer></script>
</head>
<body data-page="dayoff" data-root="../">

  <header id="header"></header>

  <div class="sub-nav">
    <div class="container">
      <span class="sub-nav__title">일정표</span>
      <nav class="sub-nav__links" aria-label="이 페이지 안 이동">
        <a href="#roadmap">로드맵</a>
        <a href="#offline" data-spy="#offline-col">오프라인</a>
      </nav>
    </div>
  </div>

  <main>

    <!-- 히어로 -->
    <section class="tile hero" aria-labelledby="hero-title">
      <div class="container">
        <p class="tile__eyebrow" data-text="campTitle"></p>
        <h1 class="hero__title" id="hero-title">교육 일정</h1>
        <p class="hero__lead">교육 기간의 단계별 로드맵과 오프라인 일정을 한 페이지에 모았어요.</p>
        <dl class="hero__facts" id="hero-facts"></dl>
      </div>
    </section>

    <!-- 1. 단계별 로드맵 (company.md 6) -->
    <section class="tile tile--parchment" id="roadmap" aria-labelledby="roadmap-title">
      <div class="container">
        <div class="tile__head">
          <p class="tile__eyebrow">단계별 로드맵</p>
          <h2 class="tile__title" id="roadmap-title"></h2>
        </div>
        <ol class="roadmap" id="roadmap-list"></ol>
        <p class="sum-check" id="roadmap-sum"></p>
      </div>
    </section>

    <!-- 2. 오프라인 일정 (company.md 5) -->
    <section class="tile" id="offline" aria-labelledby="offline-title">
      <div class="container">
        <div class="tile__head">
          <p class="tile__eyebrow">오프라인 일정</p>
          <h2 class="tile__title" id="offline-title">만나는 날</h2>
          <p class="tile__lead">모든 날짜는 한국 시간(KST) 기준이에요.</p>
        </div>
        <div class="split">
          <div id="offline-col">
            <h3 class="split__title">오프라인 일정</h3>
            <ul class="rows" id="offline-list"></ul>
            <p class="split__more"><a href="../location/index.html">장소와 오시는 길 보기 ›</a></p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer id="footer"></footer>

</body>
</html>
