<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">블루핀랩 캠퍼스 가상 약도</title>
  <desc id="d">한울역 3번 출구에서 새벽로를 따라 도보 5분 거리에 블루핀타워가 있는 가상 약도</desc>
  <rect width="640" height="400" fill="#ffffff"/>
  <g fill="none" stroke="#e0e0e0" stroke-width="14">
    <path d="M0 250H640"/>
    <path d="M200 0V400"/>
    <path d="M470 0V400"/>
  </g>
  <text x="20" y="242" font-family="sans-serif" font-size="13" fill="#7a7a7a">새벽로</text>
  <g fill="#f5f5f7" stroke="#e0e0e0">
    <rect x="230" y="40" width="210" height="80"/>
    <rect x="230" y="285" width="210" height="80"/>
    <rect x="500" y="285" width="120" height="80"/>
    <rect x="20" y="40" width="150" height="80"/>
  </g>
  <rect x="500" y="150" width="120" height="70" fill="#1a1a1a"/>
  <text x="560" y="180" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">블루핀타워</text>
  <text x="560" y="200" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">5층 캠퍼스</text>
  <circle cx="200" cy="250" r="9" fill="#0066cc"/>
  <text x="200" y="278" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">한울역 3번 출구</text>
  <path d="M209 250H500" stroke="#0066cc" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="350" y="236" font-family="sans-serif" font-size="12" fill="#0066cc" text-anchor="middle">도보 5분</text>
  <text x="620" y="392" font-family="sans-serif" font-size="11" fill="#7a7a7a" text-anchor="end">가상 약도 (실제 위치 아님)</text>
</svg>
